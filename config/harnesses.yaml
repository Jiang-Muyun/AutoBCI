# Select search.model and search.harness in an experiment YAML.
# OpenAI: codex; Anthropic: claude-code; DeepSeek/Qwen: claude-code or opencode.
# Google: gemini, using the existing Gemini CLI login or GEMINI_API_KEY.
# Set credentials in the named environment variables; never put API keys in YAML.
# Codex uses its existing CLI login. Native Claude/Gemini logins are also supported.
max_output_tokens: 65536

providers:
  google:
    api_key_env: GEMINI_API_KEY
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    claude_code_url: https://api.anthropic.com
  deepseek:
    api_key_env: DEEPSEEK_API_KEY
    claude_code_url: https://api.deepseek.com/anthropic
    opencode_url: https://api.deepseek.com/v1
  qwen:
    api_key_env: QWEN_TOKEN_PLAN_API_KEY
    claude_code_url: https://token-plan.maas.qwencloudapi.com/apps/anthropic
    opencode_url: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
