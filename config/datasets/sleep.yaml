# Filenames are relative to the sleep directory in ../path.yaml.
# Full 30-second epochs at 100 Hz; ordered channels: F3, F4, C3, C4, O1, O2.
input_shape: [6, 3000]
validation_fraction: 0.20  # Unused here: preserve the HDF5 subject split manifests.

datasets:
  SLEEP_EDF:
    filename: SLEEP_EDF.h5
    split_manifest: SLEEP_EDF.yaml
    family: sleep
    layout: subject_splits
    labels: [Wake, N1, N2, N3, REM]
    input_samples: 3000

  SLEEP_HMC:
    filename: SLEEP_HMC.h5
    split_manifest: SLEEP_HMC.yaml
    family: sleep
    layout: subject_splits
    labels: [Wake, N1, N2, N3, REM]
    input_samples: 3000

  SLEEP_ISRUC:
    filename: SLEEP_ISRUC.h5
    split_manifest: SLEEP_ISRUC.yaml
    family: sleep
    layout: subject_splits
    labels: [Wake, N1, N2, N3, REM]
    input_samples: 3000
